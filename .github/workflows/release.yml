name: Release

# Bumps the version, turns the Unreleased changelog section into release notes,
# submits the extension to addons.mozilla.org, then commits, tags and creates a GitHub release.
on:
  workflow_dispatch:
    inputs:
      bump:
        description: Version bump
        type: choice
        options: [patch, minor, major]
        default: patch
      version:
        description: Exact version (e.g. 1.2.3); overrides the bump when set
        type: string
        required: false

permissions:
  contents: write

concurrency:
  group: release

jobs:
  release:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: amo
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test

      - name: Bump version and update changelog
        id: bump
        env:
          SPEC: ${{ inputs.version || inputs.bump }}
        run: |
          version=$(node scripts/release.js "$SPEC" "$RUNNER_TEMP/notes.md")
          if git rev-parse -q --verify "refs/tags/v$version" >/dev/null || git ls-remote --exit-code --tags origin "v$version" >/dev/null; then
            echo "::error::Tag v$version already exists"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          node -e '
            const fs = require("fs");
            const meta = JSON.parse(fs.readFileSync("amo-metadata.json", "utf8"));
            meta.version.release_notes = { "en-US": fs.readFileSync(process.argv[1], "utf8") };
            fs.writeFileSync(process.argv[2], JSON.stringify(meta, null, 2));
          ' "$RUNNER_TEMP/notes.md" "$RUNNER_TEMP/amo-metadata.json"

      - run: npm test

      - name: Sign and submit to AMO
        env:
          WEB_EXT_API_KEY: ${{ secrets.AMO_JWT_ISSUER }}
          WEB_EXT_API_SECRET: ${{ secrets.AMO_JWT_SECRET }}
        run: >
          npx web-ext sign
          --source-dir src
          --channel listed
          --amo-metadata "$RUNNER_TEMP/amo-metadata.json"
          --approval-timeout 0

      - name: Commit, tag and push
        env:
          VERSION: ${{ steps.bump.outputs.version }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "Release v$VERSION"
          git tag "v$VERSION"
          git push origin HEAD:main "v$VERSION"

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.bump.outputs.version }}
        run: |
          npm run build
          gh release create "v$VERSION" web-ext-artifacts/*.zip --title "v$VERSION" --notes-file "$RUNNER_TEMP/notes.md" --verify-tag
